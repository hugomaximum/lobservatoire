[project]
name = "veille-emplois-worker"
version = "0.1.0"
description = "Workflow de veille emploi quotidienne : recherche d'offres, résumé, validation oui/non, brouillon de candidature."
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]>=3.10,<4",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
